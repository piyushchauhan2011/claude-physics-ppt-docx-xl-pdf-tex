name: CI/CD — Projectile Motion Dashboard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE_NAME: projectile-dashboard

jobs:
  lint-and-check:
    name: Lint & Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile app.py physics.py

      - name: Lint check (ruff)
        run: ruff check app.py physics.py tests

      - name: Run unit tests (pytest)
        run: pytest -v

  build-and-test:
    name: Build & Integration Test
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name dashboard-test -p 8501:8501 ${{ env.IMAGE_NAME }}:test

      - name: Wait for Streamlit health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Streamlit is healthy (attempt $i/10)"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 3s..."
            sleep 3
          done
          echo "Streamlit failed to become healthy after 10 attempts"
          exit 1

      - name: Dump container logs
        if: always()
        run: docker logs dashboard-test || true

      - name: Clean up container
        if: always()
        run: docker rm -f dashboard-test || true

  publish:
    name: Publish to GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
