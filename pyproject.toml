[tool.coverage.run]
source = ["physics.py"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "app.py",
    "generate_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
